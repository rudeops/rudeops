<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="RudeOps, le DevOps sans bullshit">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1a1a1a" opacity="0.18"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- fond jaune RudeOps -->
  <rect width="1200" height="400" rx="20" fill="#FDC526"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>

  <!-- logo >_ -->
  <g transform="translate(70 110)" stroke="#1a1a1a" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="0,0 80,65 0,130"/>
    <line x1="110" y1="140" x2="190" y2="140"/>
  </g>

  <!-- titre -->
  <text x="70" y="330" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="54" font-weight="800" fill="#1a1a1a">RudeOps</text>
  <text x="70" y="366" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" fill="#1a1a1a" opacity="0.8">le DevOps sans bullshit</text>

  <!-- terminal -->
  <g transform="translate(400 48)" filter="url(#shadow)">
    <rect width="740" height="304" rx="14" fill="#141414"/>
    <rect width="740" height="40" rx="14" fill="#262626"/>
    <rect y="26" width="740" height="14" fill="#262626"/>
    <circle cx="26" cy="20" r="7" fill="#ff5f56"/>
    <circle cx="50" cy="20" r="7" fill="#ffbd2e"/>
    <circle cx="74" cy="20" r="7" fill="#27c93f"/>
    <text x="370" y="26" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#8a8a8a">rudeops@montargis: ~</text>

    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19">
      <text x="28" y="84"><tspan fill="#FDC526">$</tspan><tspan fill="#e8e8e8"> whoami</tspan></text>
      <text x="28" y="112" fill="#9a9a9a">newsletter DevOps/SRE en français, chaque lundi</text>

      <text x="28" y="152"><tspan fill="#FDC526">$</tspan><tspan fill="#e8e8e8"> cat ~/.policy</tspan></text>
      <text x="28" y="180" fill="#9a9a9a">cookies=0  trackers=0  mauvaise_foi=max</text>

      <text x="28" y="220"><tspan fill="#FDC526">$</tspan><tspan fill="#e8e8e8"> history | grep "rm -rf"</tspan></text>
      <text x="28" y="248" fill="#ff6b6b">  42  rm -rf /etc   # j’ai appris tar le lendemain</text>

      <text x="28" y="286"><tspan fill="#FDC526">$</tspan><tspan fill="#e8e8e8"> </tspan></text>
      <rect x="48" y="270" width="11" height="21" fill="#FDC526"/>
    </g>
  </g>
</svg>
